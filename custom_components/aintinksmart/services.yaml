send_image:
  name: Send Image
  description: Sends an image to the e-ink display via BLE. Provide one of: image_path, image_data, or image_entity_id.
  target:
    entity:
      integration: aintinksmart
  fields:
    image_path:
      name: Image Path
      description: "Local file path or URL to the image (e.g., /media/dashboard.png or https://example.com/image.png)"
      example: "/media/dashboard.png"
      selector:
        text:
    image_data:
      name: Image Data (Base64)
      description: Base64 encoded image data. Mutually exclusive with image_path and image_entity_id.
      example: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
      selector:
        text:
          multiline: true
    image_entity_id:
      name: Image Entity ID
      description: Entity ID of a camera or image entity to fetch the image from. Mutually exclusive with image_path and image_data.
      example: image.my_generated_picture
      selector:
        entity:
          domain:
            - image
            - camera
    mode:
      name: Color Mode
      description: "Color mode for image processing: bw (black/white) or bwr (black/white/red)."
      required: true
      example: bwr
      selector:
        select:
          options:
            - "bw"
            - "bwr"
